name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Trust-model manifest audit
        run: python3 scripts/check_manifest.py

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug and unsigned release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Generate release checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk > SHA256SUMS.txt

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mozahhemgir-ci-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            SHA256SUMS.txt

