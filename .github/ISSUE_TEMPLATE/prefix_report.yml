name: Prefix report
description: Propose adding or removing an Iranian spam-call prefix
title: "[Prefix] "
body:
  - type: input
    id: prefix
    attributes:
      label: Prefix
      description: Domestic format, for example 0942. Do not submit a full personal phone number.
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Proposed action
      options:
        - Add to default block catalog
        - Remove from default block catalog
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and false-positive assessment
      description: Explain why this prefix is predominantly unwanted/promotional and whether legitimate callers may use it.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include a complete personal phone number.
          required: true
